apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  labels:
    app.kubernetes.io/name: kafka-topic-init
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: go-order-service
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topic-init
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: go-order-service
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-init
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /opt/kafka/bin/kafka-topics.sh
          args:
            - --bootstrap-server
            - $(KAFKA_BOOTSTRAP_SERVERS)
            - --create
            - --if-not-exists
            - --topic
            - $(KAFKA_TOPIC)
            - --partitions
            - "3"
            - --replication-factor
            - "1"
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_TOPIC
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: go-order-service
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: go-order-service
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - order-service
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
            action: keep
            regex: go-order-service
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            action: keep
            regex: api|publisher|consumer
          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: http|metrics
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            target_label: component
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

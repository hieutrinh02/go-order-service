apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pvc.yaml
  - service.yaml
  - deployment.yaml

configMapGenerator:
  - name: grafana-datasource
    files:
      - prometheus.yml=config/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=config/dashboards.yml
  - name: grafana-dashboard
    files:
      - go-order-service.json=config/go-order-service.json

generatorOptions:
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: go-order-service

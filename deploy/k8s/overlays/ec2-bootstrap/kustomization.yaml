apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ec2

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: "app.kubernetes.io/component in (api,publisher,consumer)"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
